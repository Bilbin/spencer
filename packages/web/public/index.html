<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="spencer-token" content="__SPENCER_TOKEN__">
  <meta name="color-scheme" content="light dark">
  <title>Spencer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Channels"></aside>
    <div id="backdrop" class="backdrop" hidden></div>
    <main id="main" class="main"></main>
  </div>
  <div id="conn" class="conn" role="status" hidden>Can't reach Spencer on this computer. Retrying…</div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>Spencer's UI needs JavaScript.</noscript>
</body>
</html>
