# /etc/nginx/sites-available/spencer.pjalv.com  (symlink into sites-enabled)
# HTTP only at first. Then run: sudo certbot --nginx -d spencer.pjalv.com --redirect
# which adds the :443 TLS server and the :80 → https redirect.
# Always `sudo nginx -t` before `sudo systemctl reload nginx`.

# Uniquely named so it can't collide with a global `$connection_upgrade` map in another vhost.
map $http_upgrade $spencer_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name spencer.pjalv.com;

    client_max_body_size 1m;
    # No access logs: request paths contain channel ids (never secrets, but keep it minimal).
    access_log off;

    location /ws {
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spencer_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
