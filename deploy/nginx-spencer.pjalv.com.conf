# /etc/nginx/sites-available/spencer.pjalv.com  (symlinked into sites-enabled)
# Spencer message relay. Matches this host's other vhosts: certbot webroot + hand-written TLS block.
#
# First issue the cert (the :80 block alone serves the ACME challenge):
#   sudo certbot certonly --webroot -w /var/www/html -d spencer.pjalv.com
# then install this file. Always `sudo nginx -t` before `sudo systemctl reload nginx`.

# Uniquely named so it can't collide with a global `$connection_upgrade` map elsewhere.
map $http_upgrade $spencer_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name spencer.pjalv.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spencer.pjalv.com;
    ssl_certificate     /etc/letsencrypt/live/spencer.pjalv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spencer.pjalv.com/privkey.pem;

    client_max_body_size 1m;
    # No access logs: request paths contain channel ids (never secrets, but keep it minimal).
    access_log off;

    location /ws {
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spencer_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8820;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
