# Builds the single-file binaries (scripts/build-binary.mjs) and attaches them to a GitHub release
# when a tag like v0.2.0 is pushed. Linux targets build on Ubuntu; macOS targets build on macOS so they
# can be ad-hoc signed with codesign.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, targets: "linux-x64 linux-arm64" }
          - { os: macos-15, targets: "darwin-arm64 darwin-x64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: npm ci
      - run: npm run typecheck
      - run: for t in ${{ matrix.targets }}; do node scripts/build-binary.mjs --target "$t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: spencer-${{ matrix.os }}
          path: |
            dist/binary/spencer-*
            !dist/binary/spencer.cjs
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cat out/*.sha256 > out/SHA256SUMS && ls -la out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/spencer-* out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
