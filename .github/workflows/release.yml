# Builds the Linux single-file binaries (scripts/build-binary.mjs) and attaches them to a GitHub release
# when a tag like v0.1.0 is pushed.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: npm ci
      - run: npm run typecheck
      - run: for t in linux-x64 linux-arm64; do node scripts/build-binary.mjs --target "$t"; done
      - uses: actions/upload-artifact@v4
        with:
          name: spencer-linux
          path: |
            dist/binary/spencer-*
            !dist/binary/spencer.cjs
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cat out/*.sha256 > out/SHA256SUMS && ls -la out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/spencer-* out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
